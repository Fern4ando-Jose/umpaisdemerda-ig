name: Coletor de pauta (diário)

# Puxa as manchetes (Google News RSS, grátis, sem chave) nas 4 frentes e marca 🆕 o
# que é inédito. Dedup VERSIONADO: o histórico de hashes vive em data/pauta-seen.json
# e é commitado de volta a cada rodada → a pauta do dia só traz o que é novo.
# NÃO publica nada; é o insumo que os posts do dia usam como GATILHO do padrão.
#
# DIÁRIO desde 27/07/2026 (ordem do dono: "cada dia tem coisa diferente"). Antes era
# semanal, e por isso a conta repetia assunto. Dia sem novidade não zera nada: o
# coletor só reescreve data/pauta-semana.json quando há manchete nova.
# Escopo: TRABALHO.md, bloco `pauta:`.

on:
  schedule:
    - cron: "0 9 * * *" # todo dia 09:00 UTC (06:00 BRT) — antes dos posts das 09:17
  workflow_dispatch: {}

permissions:
  contents: write # para commitar o data/pauta-seen.json atualizado

concurrency:
  group: coletor-pauta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar pauta (marca 🆕 e atualiza dedup)
        run: |
          node scripts/coletor-pauta.mjs | tee pauta-out.txt

      - name: Publicar no resumo do job
        if: always()
        run: |
          {
            echo '## Pauta da semana — Um País de Merda'
            echo '```'
            cat pauta-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # BUG CORRIGIDO 27/07/2026: este passo commitava SÓ o dedup (pauta-seen.json).
      # A pauta em si (pauta-semana.json) — o arquivo que o app LÊ para escrever o
      # post — era gerada aqui e JOGADA FORA. Resultado: a pauta ficou congelada em
      # 12/07 enquanto o dedup avançava, ou seja, as manchetes novas eram marcadas
      # como "já vistas" e NUNCA chegavam ao post. Era a causa de "só repete o mesmo
      # assunto". Agora os DOIS arquivos voltam para o repositório.
      - name: Commitar pauta e dedup atualizados (se mudaram)
        run: |
          if [[ -n "$(git status --porcelain data/pauta-seen.json data/pauta-semana.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/pauta-seen.json data/pauta-semana.json
            git commit -m "chore(pauta): atualiza pauta do dia e dedup [skip ci]"
            git push
          else
            echo "sem novidades — nada a commitar"
          fi
